services:
  api:
    build: ./apps/api
    ports: ["8000:8000"]
    environment:
      CORS_ORIGINS: http://localhost:8080
      OLLAMA_BASE_URL: http://ollama:11434
      DATABASE_URL: postgresql+asyncpg://techspace:techspace@postgres:5432/techspace
      JWT_SECRET: ${JWT_SECRET:-local-dev-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  ui:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./ui:/usr/share/nginx/html:ro"]
    depends_on: [api]
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: techspace
      POSTGRES_USER: techspace
      POSTGRES_PASSWORD: techspace
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techspace -d techspace"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ollama_data:
