model:
  id: Qwen/Qwen3-0.6B
  trust_remote_code: false

data:
  dataset_id: ./data/processed/techspace-dataset-0.1.0.parquet
  config: null
  split: train
  max_samples: 10000
  max_seq_length: 2048
  text_column: text

training:
  output_dir: outputs/techspace-llm
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0002
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 250
  eval_steps: 250
  save_total_limit: 2
  gradient_checkpointing: true
  bf16: true
  fp16: false
  report_to: none

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: auto

hub:
  model_repo: null
  dataset_repo: null
  private: false
