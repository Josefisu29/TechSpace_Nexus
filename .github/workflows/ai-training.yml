name: TechSpace AI data and training pipeline

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Pipeline stage
        required: true
        default: all
        type: choice
        options: [acquire, clean, train, evaluate, promote, all]
  schedule:
    - cron: '17 2 * * 0'

permissions:
  contents: read

concurrency:
  group: techspace-ai-training
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pipeline dependencies
        run: python -m pip install --upgrade pip pyyaml
      - name: Validate manifests and dry-run pipeline
        run: python training/auto_pipeline.py --stage "${{ inputs.stage || 'all' }}" --dry-run
      - name: Publish pipeline plan
        run: |
          echo "The GitHub scheduler validates and plans the pipeline."
          echo "Heavy dataset downloads and GPU training must run on configured Colab/GPU workers."
